<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Interactive Photo Gallery</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    #image {
      width: 600px;
      height: 350px;
      margin: 20px auto;
      border: 3px solid #333;
      background-color: white;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    figure {
      margin: 0;
    }

    .gallery img {
      width: 250px;
      height: 160px;
      object-fit: cover;
      cursor: pointer;
      border: 3px solid #333;
      border-radius: 5px;
    }

    .gallery img:hover,
    .gallery img:focus {
      border-color: #0066cc;
      outline: 3px solid #0066cc;
    }

    figcaption {
      font-weight: bold;
      margin-top: 5px;
    }
  </style>
</head>

<body onload="addTabIndex()">

  <h1>My Accessible Photo Gallery</h1>

  <div id="image">
    Hover over or focus on an image below to display here.
  </div>

  <div class="gallery">

    <figure>
      <img
        src="Mountain landscape with blue sky.jpg"
        alt="Mountain landscape with blue sky"
        onmouseover="upDate(this)"
        onmouseleave="undo()"
        onfocus="upDate(this)"
        onblur="undo()">
      <figcaption>Mountain Landscape</figcaption>
    </figure>

    <figure>
      <img
        src="Blue ocean and sandy beach.jpg"
        alt="Blue ocean and sandy beach"
        onmouseover="upDate(this)"
        onmouseleave="undo()"
        onfocus="upDate(this)"
        onblur="undo()">
      <figcaption>Sunny Beach</figcaption>
    </figure>

    <figure>
      <img
        src="Green forest and mountain landscape.jpg"
        alt="Green forest and mountain landscape"
        onmouseover="upDate(this)"
        onmouseleave="undo()"
        onfocus="upDate(this)"
        onblur="undo()">
      <figcaption>Forest</figcaption>
    </figure>

    <figure>
      <img
        src="Beautiful lake surrounded by mountains.jpg"
        alt="Beautiful lake surrounded by mountains"
        onmouseover="upDate(this)"
        onmouseleave="undo()"
        onfocus="upDate(this)"
        onblur="undo()">
      <figcaption>Mountain Lake</figcaption>
    </figure>

    <figure>
      <img
        src="Sunset over a mountain landscape.jpg"
        alt="Sunset over a mountain landscape"
        onmouseover="upDate(this)"
        onmouseleave="undo()"
        onfocus="upDate(this)"
        onblur="undo()">
      <figcaption>Sunset</figcaption>
    </figure>

    <figure>
      <img
        src="Green valley with mountains in the background.jpg"
        alt="Green valley with mountains in the background"
        onmouseover="upDate(this)"
        onmouseleave="undo()"
        onfocus="upDate(this)"
        onblur="undo()">
      <figcaption>Green Valley</figcaption>
    </figure>

  </div>

  <script>
    function upDate(element) {
      console.log("upDate function triggered");
      console.log("Alt:", element.alt);
      console.log("Source:", element.src);

      document.getElementById("image").innerHTML = element.alt;

      document.getElementById("image").style.backgroundImage =
        "url('" + element.src + "')";
    }

    function undo() {
      console.log("undo function triggered");

      document.getElementById("image").innerHTML =
        "Hover over or focus on an image below to display here.";

      document.getElementById("image").style.backgroundImage = "url('')";
    }

    function addTabIndex() {
      console.log("addTabIndex function triggered");

      var images = document.querySelectorAll("img");

      for (var i = 0; i < images.length; i++) {
        images[i].setAttribute("tabindex", "0");
      }
    }
  </script>

</body>
</html>
